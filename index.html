<!doctype html>
<html lang="en" data-theme="studio-dark" data-density="balanced" data-typeset="workhorse">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a1f" />
    <title>Loomwright</title>
    <link rel="icon" href="icons/loomwright.svg" type="image/svg+xml" />
    <script>
      // Pre-React paint: restore the appearance Tweaks before first render,
      // so nobody sees a flash of the default theme. These live in
      // localStorage rather than IndexedDB precisely because they must be
      // readable synchronously, before a single pixel is painted.
      try {
        var d = document.documentElement;
        var t = localStorage.getItem('lw:theme');
        if (t) d.setAttribute('data-theme', t);
        var tw = JSON.parse(localStorage.getItem('lw:tweaks') || '{}');
        if (tw.density) d.setAttribute('data-density', tw.density);
        if (tw.typeset) d.setAttribute('data-typeset', tw.typeset);
        if (tw.motion) d.setAttribute('data-motion-pref', tw.motion);
        if (tw.focus) d.setAttribute('data-focus', tw.focus);
        if (tw.measure) d.style.setProperty('--measure', tw.measure + 'em');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
